name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/ROADMAP.md` first — it may already be planned (and the roadmap shows what is
        deliberately out of scope, e.g. segments/KOMs and cloud services).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation on the watch/phone, not the implementation.
      placeholder: "While running I can't tell my current HR zone, so I can't pace myself."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: How you imagine it working. Sketches welcome.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Watch recording screen
        - Watch settings / configuration
        - Review / upload flow
        - Data (TCX fields, laps, splits)
        - Phone app
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this respects
      options:
        - label: Keeps the review gate (nothing uploads without an explicit Done)
          required: false
        - label: Keeps data self-hosted (no third-party services)
          required: false
